databases:
  - name: svts-db
    plan: starter

services:
  - type: web
    name: svts
    runtime: docker
    plan: starter
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: SETUP_TOKEN
        generateValue: true   # shown in the Render dashboard; needed once for first-admin setup
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: svts-db
          property: connectionString
